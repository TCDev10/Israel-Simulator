name: Sync Wiki

on:
  push:
    branches:
      - main
    paths:
      - 'wiki/**'
  workflow_dispatch:

concurrency:
  group: wiki-sync
  cancel-in-progress: true

jobs:
  sync-wiki:
    name: Synchronize Wiki Pages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout wiki repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}.wiki
          path: .wiki
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        continue-on-error: true
        id: checkout-wiki

      - name: Check wiki availability
        if: steps.checkout-wiki.outcome != 'success'
        run: |
          echo "::warning::The GitHub Wiki repository (${{ github.repository }}.wiki) has not been initialized yet on GitHub."
          echo "To initialize it, visit https://github.com/${{ github.repository }}/wiki and click 'Create the first page' once."
          exit 0

      - name: Sync wiki files and push
        if: steps.checkout-wiki.outcome == 'success'
        run: |
          rm -rf .wiki/*
          cp -r wiki/* .wiki/
          cd .wiki
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to sync in wiki."
          else
            git commit -m "docs(wiki): sync wiki pages from main repository [skip ci]"
            git push origin HEAD
            echo "Successfully updated GitHub Wiki."
          fi


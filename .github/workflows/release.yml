# Israel-Simulator Release Workflow (TODO.md section 4.8 / PLAN.md section 53).
#
# Builds, validates, verifies, and packages release artifacts when a version tag is pushed
# or dispatched manually.

name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for release (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build, verify, and publish release package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          tag="${GITHUB_REF_NAME:-${{ inputs.tag_name }}}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Run complete validation suite
        shell: bash
        run: ./gradlew build --stacktrace --warning-mode all

      - name: Verify release jar and compute checksums
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          jar_path=$(find build/libs -maxdepth 1 -name 'israel_simulator-*.jar' ! -name '*-sources.jar' | head -n 1)
          if [ -z "${jar_path}" ]; then
            echo "::error::No mod jar found in build/libs"
            exit 1
          fi
          echo "Verifying ${jar_path}"
          unzip -l "${jar_path}" | grep -q "META-INF/neoforge.mods.toml" || { echo "::error::neoforge.mods.toml missing"; exit 1; }
          unzip -l "${jar_path}" | grep -q "com/israelsimulator/IsraelSimulator.class" || { echo "::error::entrypoint missing"; exit 1; }
          unzip -p "${jar_path}" META-INF/neoforge.mods.toml | grep -q 'modId="israel_simulator"' || { echo "::error::modId missing"; exit 1; }
          sha256sum "${jar_path}" | tee SHA256SUMS.txt
          echo "jar_file=${jar_path}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag_name != ''
        with:
          name: "Israel-Simulator ${{ steps.meta.outputs.version }}"
          tag_name: ${{ steps.meta.outputs.tag }}
          files: |
            ${{ steps.verify.outputs.jar_file }}
            SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true

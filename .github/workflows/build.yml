# Israel-Simulator CI/CD pipeline (TODO.md section 4 / section 71).
#
# Mandatory chain validated by this workflow:
#   compile -> automated build -> mod .jar produced -> .jar published as a CI artifact

name: build

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and package mod jar
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v6

      - name: Compute artifact metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=israel-simulator-${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build
        shell: bash
        run: ./gradlew build --stacktrace --warning-mode all

      - name: Verify packaged jar
        shell: bash
        run: |
          set -euo pipefail
          jar_path=$(find build/libs -maxdepth 1 -name 'israel_simulator-*.jar' ! -name '*-sources.jar' | head -n 1)
          if [ -z "${jar_path}" ]; then
            echo "::error::No mod jar found in build/libs"
            exit 1
          fi
          echo "Verifying ${jar_path}"
          unzip -l "${jar_path}" | grep -q "META-INF/neoforge.mods.toml" || { echo "::error::neoforge.mods.toml missing from jar"; exit 1; }
          unzip -l "${jar_path}" | grep -q "com/israelsimulator/IsraelSimulator.class" || { echo "::error::mod entrypoint class missing from jar"; exit 1; }
          echo "Expanded metadata check:"
          unzip -p "${jar_path}" META-INF/neoforge.mods.toml | grep -q 'modId="israel_simulator"' || { echo "::error::mod id not expanded in metadata"; exit 1; }
          sha256sum "${jar_path}" | tee sha256.txt

      - name: Upload mod jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: build/libs/israel_simulator-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{ steps.meta.outputs.short_sha }}
          path: |
            build/reports/
          if-no-files-found: ignore
          retention-days: 7
